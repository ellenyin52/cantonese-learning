const dateKey=(date=new Date())=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
function streak(dates,now=new Date()){const set=new Set(dates);const day=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);if(!set.has(dateKey(day)))day.setDate(day.getDate()-1);let count=0;while(set.has(dateKey(day))){count++;day.setDate(day.getDate()-1);}return count;}
function currentLesson(state,today,total){const entry=state.checkins.find(x=>x.date===today);return entry?entry.lesson:Math.min(state.completed.length,total-1);}

const progressKeys={'daily-cantonese-v1':7,'daily-cantonese-advanced-v1':7,'daily-cantonese-90-v1':90};
const empty=()=>({completed:[],checkins:[],marks:{},sessions:{},challenges:{}});
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s+'T12:00:00Z'))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;
function validateProgress(value,total){
 const fail=()=>{throw new Error('学习记录格式不正确，请选择从本 App 导出的备份。');};
 if(!value||typeof value!=='object'||!Array.isArray(value.completed)||!Array.isArray(value.checkins)||!value.marks||!value.sessions)fail();
 const id=n=>Number.isInteger(n)&&n>=0&&n<total;
 if(value.completed.length>total||!value.completed.every(id)||new Set(value.completed).size!==value.completed.length)fail();
 // Courses advance in order. This keeps the next-day lesson deterministic.
 if(!value.completed.every((n,i)=>n===i))fail();
 if(value.checkins.length>10000)fail();
 const dates=new Set();
 const checkins=value.checkins.map(x=>{if(!x||!validDate(x.date)||!id(x.lesson)||!value.completed.includes(x.lesson)||dates.has(x.date))fail();dates.add(x.date);return {date:x.date,lesson:x.lesson};});
 const result=empty();result.completed=[...value.completed];result.checkins=checkins;
 for(const [k,items] of Object.entries(value.marks)){if(!/^\d+$/.test(k)||!id(Number(k))||!Array.isArray(items)||items.length>15||new Set(items).size!==items.length||!items.every(x=>typeof x==='string'&&/^(w[0-9]|s[0-4])$/.test(x)))fail();result.marks[k]=[...items];}
 for(const [k,v] of Object.entries(value.sessions)){if(!validDate(k)||!Number.isInteger(v)||v<0||v>1200)fail();result.sessions[k]=v;}
 for(const [k,v] of Object.entries(value.challenges||{})){if(!/^\d+$/.test(k)||!id(Number(k))||typeof v!=='boolean')fail();result.challenges[k]=v;}
 return result;
}
function parseBackup(text){
 const backup=JSON.parse(text);if(backup?.app!=='daily-cantonese'||backup.version!==1||!backup.records||typeof backup.records!=='object')throw new Error('不是有效的日日粤备份文件。');
 const records={};for(const [key,value] of Object.entries(backup.records)){if(!Object.hasOwn(progressKeys,key))throw new Error('备份包含无法识别的课程。');records[key]=validateProgress(value,progressKeys[key]);}
 if(!Object.keys(records).length)throw new Error('备份没有学习记录。');return records;
}

// Only Cantonese voices: never silently fall back to Mandarin.
function cantoneseVoice(voices){
  const suitable=voices.filter(v=>/^(yue(?:[-_]|$)|zh[-_]hk$)/i.test(v.lang));
  return suitable.find(v=>v.localService)||suitable[0]||null;
}
function createSpeech(onChange=()=>{}){
  const synth=window.speechSynthesis;
  let voice=null,active=null,watchdog=null;
  const available=!!synth&&typeof window.SpeechSynthesisUtterance==='function';
  function refresh(){voice=available?cantoneseVoice(synth.getVoices()):null;onChange();}
  function stop(){clearTimeout(watchdog);active=null;if(available)synth.cancel();onChange();}
  function play(text,rate){
    if(!available)return;
    voice=cantoneseVoice(synth.getVoices());
    if(!voice){onChange();return;}
    stop();
    const utterance=new window.SpeechSynthesisUtterance(text);active=utterance;
    utterance.voice=voice;utterance.lang=voice.lang;utterance.rate=rate;utterance.volume=1;
    const finish=()=>{if(active!==utterance)return;clearTimeout(watchdog);active=null;onChange();};
    const fail=()=>{if(active!==utterance)return;finish();window.dispatchEvent(new CustomEvent('speechfailure'));};
    utterance.onstart=()=>clearTimeout(watchdog);utterance.onend=finish;utterance.onerror=fail;
    watchdog=setTimeout(()=>{if(active===utterance){synth.cancel();fail();}},12000);
    onChange();try{synth.resume();synth.speak(utterance);}catch{fail();}
  }
  if(available)synth.addEventListener('voiceschanged',refresh);
  voice=available?cantoneseVoice(synth.getVoices()):null;
  window.addEventListener('pagehide',stop);
  return {play,stop,refresh,get voice(){return voice;},get available(){return available;},get speaking(){return !!active;}};
}

function changeLevel(next){speech.stop();running=false;level=next;course=plans[level].lessons;key=plans[level].key;try{localStorage.setItem('daily-cantonese-level',level);}catch{storage=false;}state=loadState();view='learn';reviewId=null;tab='words';recall=false;listening=false;render();}
function speechButtons(i,sentence){return `<span class="audio-actions" hidden><button class="speak" data-speak="${i}" data-sentence="${sentence}" data-rate="0.9" aria-label="粤语朗读第 ${i+1} 项">◖)) 朗读</button><button class="speak" data-speak="${i}" data-sentence="${sentence}" data-rate="0.65" aria-label="粤语慢速朗读第 ${i+1} 项">慢速</button></span>`;}
function speechPanel(){return `<section class="panel speech-panel"><h3>听一句，跟着讲 <span class="pill">粤语发音</span></h3><div id="speech-info"></div><button class="soft" id="stop-speech" hidden>停止朗读</button><details><summary>如何启用粤语语音？</summary><p class="tiny">Mac：系统设置 → 辅助功能 → 朗读内容（部分版本称“朗读与语音”）→ 系统声音 → 管理声音，下载“中文（香港）／粤语”语音，再重新打开浏览器。iPhone：设置 → 辅助功能 → 朗读内容／朗读与语音 → 声音，查找并下载粤语或中文（香港）语音。</p><p class="tiny">推荐 Safari。浏览器不一定开放所有系统声音，以本页检测为准。首次下载需要联网；非本地语音可能需联网并由系统服务处理文字。无需 API 密钥。</p></details></section>`;}
function updateSpeech(){
 const voice=speech.voice;
 document.querySelectorAll('.audio-actions').forEach(el=>el.hidden=!voice);
 const info=document.querySelector('#speech-info');
 if(info){const p=document.createElement('p');p.className='tiny';p.textContent=voice?`已检测到粤语语音：${voice.name}。点击“朗读”或“慢速”跟读。${voice.localService?'使用本地语音。':'此语音可能需要联网。'}`:speech.available?'当前浏览器尚未提供粤语语音，暂不显示播放按钮。听辨日可先读后遮住文字复述；也可按下方说明安装语音。':'此浏览器不支持语音朗读。听辨日可改为阅读后复述，或在 Safari 中安装粤语语音再练。';info.replaceChildren(p);}
 const stop=document.querySelector('#stop-speech');if(stop)stop.hidden=!speech.speaking;
 const listen=document.querySelector('#listening-toggle');if(listen){listen.disabled=!voice;listen.title=voice?'':'先安装可用的粤语语音才能进行听辨';}
 if(!voice&&listening){listening=false;document.querySelector('#cards')?.classList.remove('listening');if(listen)listen.textContent='隐藏全部文字，听辨练习';}
}
function card(item,i,id,sentence=false){const code=(sentence?'s':'w')+i,known=marks(id).includes(code),preview=reviewId!==null&&!state.completed.includes(id);return `<article class="word ${sentence?'sentence ':''}${known?'known':''}"><span class="number">${sentence?'DIALOGUE':'WORD'} ${String(i+1).padStart(2,'0')}</span><button class="mark" data-mark="${code}" aria-label="${known?'取消掌握':'标记掌握'}：${item[0]}" aria-pressed="${known}" ${preview?'disabled':''}>${known?'✓':'+'}</button><h3>${item[0]}</h3><div class="jyut" lang="yue-Latn">${item[1]}</div><p class="meaning">${item[2]}</p>${speechButtons(i,sentence)}</article>`;}
function week(){return Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const done=state.checkins.some(x=>x.date===dateKey(d));return `<div class="day">${['日','一','二','三','四','五','六'][d.getDay()]}<i class="${done?'done':''}">${done?'✓':d.getDate()}</i></div>`;}).join('');}
function challengePanel(l){if(level==='basic')return '';const preview=reviewId!==null&&!state.completed.includes(lessonId());return `<section class="panel challenge"><p class="eyebrow">${l.format||'SPEAK IT YOURSELF · 开口挑战'}</p><h3>${l.kind==='assessment'?'这一次，独立讲出来。':'把学过的，变成自己的话。'}</h3><p>${l.challenge}</p><p class="tiny">自主练习，不录音、不自动评分。每项词句重新练习后再标记掌握；复习日也从未掌握状态开始。</p><div class="practice-tools"><button class="soft" id="recall-toggle">${recall?'显示粤语与粤拼':'遮住粤语与粤拼，自测一下'}</button><button class="soft" id="listening-toggle" disabled>${listening?'揭晓全部文字':'隐藏全部文字，听辨练习'}</button></div>${l.kind==='assessment'?'<ul class="tiny"><li>能不看笔记说明自己的需求或观点。</li><li>能追问或请对方换个说法。</li><li>能更改一个条件，再回答一次。</li></ul>':''}<div class="divider"></div><label><input id="challenge-done" type="checkbox" ${challengeDone()?'checked':''} ${preview?'disabled':''}> 我已完成今天的${l.kind==='assessment'?'自测':'开口练习'}（自评）</label></section>`;}
function side(){const id=lessonId(),l=course[id],done=state.checkins.some(x=>x.date===today),graduated=state.completed.length===course.length;return `<aside class="side">${speechPanel()}<section class="panel"><h3>每一天，都算数 ✦</h3><div class="stat-row"><strong>${streak(state.checkins.map(x=>x.date))}<small>天连续打卡</small></strong><span class="pill">${state.checkins.length} 天积累</span></div><div class="week">${week()}</div><div class="divider"></div><p class="tiny">${state.completed.length} / ${course.length} 天课程已完成 · 中断后继续，不跳课。</p><div class="progressbar"><span style="width:${state.completed.length/course.length*100}%"></span></div></section><section class="panel checkin"><h3>给自己 20 分钟 ◷</h3><div class="timer"><strong id="timer">${timeText()}</strong><button class="soft" id="timer-toggle">${running?'暂停':seconds()?'继续学习':'开始计时'}</button></div><div class="progressbar"><span id="timer-bar" style="width:${Math.min(seconds()/12,100)}%"></span></div><p class="tiny">打开本页并开启计时才累计。完成练习即可打卡，不强制等计时结束。</p><button id="checkin" class="primary full" ${done||graduated||reviewId!==null||!readyToCheckin()?'disabled':''}>${reviewId!==null?'复习／预览 · 不重复打卡':graduated?'✓ 全部课程已完成':done?'✓ 今日已打卡':readyToCheckin()?'完成学习 · 今日打卡':level==='basic'?'掌握全部词句后打卡':'完成词句与开口练习后打卡'}</button><p class="tiny" style="text-align:center">已掌握 ${marks(id).length} / 15 项${level!=='basic'?` · 开口练习${challengeDone()?'已完成':'待完成'}`:''}</p></section><section class="panel"><h3>今日的小计划</h3><div class="plan"><b>01</b><span>${l.kind&&l.kind!=='new'?'回想 10 个词块':'掌握 10 个词块'}</span><small>6 分钟</small></div><div class="plan"><b>02</b><span>${l.kind==='listen'?'听辨与跟读 5 句':'练习 5 句生活表达'}</span><small>8 分钟</small></div><div class="plan"><b>03</b><span>自测与情景表达</span><small>6 分钟</small></div></section><section class="panel tip"><h3>✧ 今日小提示</h3><p>${l.tip||'粤拼末尾的 1–6 表示声调。先熟悉拼写，再尝试慢慢读；不必急着一次记住。'}</p><div class="divider"></div><p>系统合成语音仅供练习参考，多音字与语气可能不够准确。能使用时，优先结合真人交流。</p></section></aside>`;}
function renderSelector(){document.querySelector('#level-switch')?.remove();const selector=document.createElement('section');selector.id='level-switch';selector.className='level-switch';selector.innerHTML=`<div><strong>为自己，留一段学粤语的时间。</strong><p>${level==='ninety'?'90 天 · 15 个主题 · 新课、复习与实战交替进行':`${plans[level].name} · 原有 7 天课程，记录独立保存`}</p></div><div class="level-buttons">${Object.entries(plans).map(([id,p])=>`<button class="${level===id?'active':''}" data-level="${id}" aria-pressed="${level===id}">${p.name}</button>`).join('')}</div>`;app.before(selector);}
function lessonButton(id){const l=course[id],done=state.completed.includes(id),current=currentLesson(state,today,course.length)===id&&!done;return `<button class="course-day ${done?'done':current?'current':''}" data-open="${id}"><span>DAY ${String(id+1).padStart(2,'0')} ${done?'✓':current?'· 当前':''}</span><strong>${l.format||l.topic}</strong><small>${done?'可复习':current?'继续学习':'可预览 · 按顺序解锁打卡'}</small></button>`;}
function renderCatalog(){app.innerHTML=`<section class="panel catalog-intro"><p class="eyebrow">YOUR LEARNING JOURNEY</p><h2>${level==='ninety'?'90 天，从生活用语到自主表达。':'回到适合你的起点。'}</h2><p class="tiny">${level==='ninety'?'15 个主题，每个主题 6 天：2 天新课、1 天回想、1 天听辨、1 天情景对话、1 天小测。共 30 天新课 + 60 天有明确任务的复习与应用，不是 90 天都学新词。':'基础与进阶课程各 7 天，可保留原有学习习惯。'}</p><p class="tiny">一天完成一课，打卡后第二天继续。中断不丢进度，连续天数会重新计算。未来课程可预览，完成的课程可随时复习。</p><div class="journey-metrics"><b>${state.completed.length}<small>已完成</small></b><b>${course.length-state.completed.length}<small>待学习</small></b><b>20<small>分钟 / 天</small></b></div></section>${level==='ninety'?courseModules.map((m,i)=>`<section class="module-group"><div class="section-head"><h2><span class="module-number">${String(i+1).padStart(2,'0')}</span> ${m.topic}</h2><small>第 ${i*6+1}–${i*6+6} 天 · ${ninetyLessons[i*6].stage}</small></div><p class="tiny">${m.goal}</p><div class="course-grid">${Array.from({length:6},(_,n)=>lessonButton(i*6+n)).join('')}</div></section>`).join(''):`<div class="course-grid">${course.map((_,i)=>lessonButton(i)).join('')}</div>`}`;}
function backupPanel(){return `<section class="panel backup-panel"><h3>给坚持，留一份备份。</h3><p class="tiny">包含 90 天、基础版与进阶版的所有本地记录。不含录音。更换文件、浏览器或设备前，先导出 JSON 备份；在新设备上导入即可继续。</p><div class="practice-tools"><button class="primary" id="export-progress">导出全部进度</button><label class="soft file-label">导入备份<input type="file" id="import-progress" accept=".json,application/json"></label></div><div id="import-preview" class="tiny" role="status"></div></section>`;}
function renderProgress(){app.innerHTML=`<section class="panel"><p class="eyebrow">YOUR LITTLE MILESTONES · ${plans[level].name}</p><h2>每一步，都留下足迹。</h2><div class="summary"><div><strong>${state.checkins.length}</strong><span>累计打卡天数</span></div><div><strong>${streak(state.checkins.map(x=>x.date))}</strong><span>连续打卡天数</span></div><div><strong>${state.completed.length} / ${course.length}</strong><span>完成课程</span></div></div><p class="tiny">进度只在当前浏览器保存，不自动跨设备同步；清除网站数据会删除记录。不同模式分别统计。</p>${state.checkins.length?state.checkins.slice().reverse().map(x=>`<div class="plan"><b>✓</b><span>${x.date} · 第 ${x.lesson+1} 天 · ${course[x.lesson].topic}</span><small>已完成</small></div>`).join(''):'<p class="tiny">还没有打卡记录。今天就是一个好开始。</p>'}</section>${backupPanel()}`;}
function renderReview(){app.innerHTML=`<section class="panel"><p class="eyebrow">LOOK BACK, MOVE FORWARD</p><h2>再见一面，记得更牢。</h2><p class="tiny">这里显示当前模式已完成的课程。复习不会重复打卡；90 天课程内也安排了专门复习日。</p>${state.completed.length?`<div class="lesson-list">${state.completed.map(id=>`<button class="panel" data-review="${id}"><span class="eyebrow">DAY ${String(id+1).padStart(2,'0')} · ${course[id].format||'已完成'}</span><h3>${course[id].topic}</h3><span class="tiny">10 个词 · 5 句对话 →</span></button>`).join('')}</div>`:'<div class="empty"><h2>先认识，再重逢。</h2><p>完成第一天后，就能在这里复习。</p><button class="primary" data-view="learn">开始今日学习 →</button></div>'}</section>`;}
function render(){
 renderSelector();queueMicrotask(updateSpeech);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 document.querySelector('#date').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
 if(view==='catalog'){renderCatalog();return;}if(view==='progress'){renderProgress();return;}if(view==='review'&&reviewId===null){renderReview();return;}
 const id=lessonId(),l=course[id],review=reviewId!==null,done=state.completed.length===course.length;
 app.innerHTML=`${!storage?'<div class="review-banner">本地记录读取或保存不可用。请检查浏览器存储权限，并在「我的足迹」导出备份。</div>':''}${done&&!review?`<div class="review-banner">✦ 你已完成 ${course.length} 天课程！可继续在「温故知新」复习。是否能熟练交流，还要通过真实对话来检验。</div>`:''}${review?'<div class="review-banner"><button class="soft" id="back-review">← 返回列表</button> <span>复习／预览 · 不重复计入打卡</span></div>':''}<div class="layout"><div><section class="hero"><div><p class="eyebrow">${review?'REVISIT':'TODAY’S LESSON'} / DAY ${String(id+1).padStart(2,'0')} OF ${course.length}</p><h2>${l.title}</h2><p>${l.stage?l.stage+' · ':''}${l.format||l.topic}</p><div class="chips"><span>◷ 20 分钟</span><span>10 个词块</span><span>5 句生活表达</span></div></div><div class="hero-art">粵<small>慢 慢 嚟</small></div></section>${level==='ninety'?`<div class="lesson-context"><span>${l.kind==='new'?'认识新表达':'复习与应用日'}</span><p>${l.kind==='new'?'今天学习本主题的一组词句，并尝试联系自己的生活。':'今天会重现本主题学过的词句，通过不同练习把它们变成能用的表达。'}</p><button class="text-button" data-view="catalog">查看 90 天路线 →</button></div>`:''}<div class="section-head"><h2>今日学习清单 <span class="tiny">/ 小步，也算进步</span></h2><small>${marks(id).length} / 15 已掌握</small></div><div class="tabs"><button data-tab="words" class="${tab==='words'?'active':''}">常用词块 · 10</button><button data-tab="sentences" class="${tab==='sentences'?'active':''}">生活对话 · 5</button>${review?'<button id="hide-meaning">隐藏释义</button>':''}</div><div class="${tab==='words'?'words':'sentences'} ${recall?'recall':''} ${listening?'listening':''}" id="cards">${(tab==='words'?l.words:l.sentences).map((item,i)=>card(item,i,id,tab!=='words')).join('')}</div>${challengePanel(l)}<div class="panel finish"><p>${tab==='words'?'每个词练习后，点 + 标记掌握；再到对话中试着使用。':'练完 5 句后，完成开口任务。复习可重复进行，打卡每天一次。'}</p><button class="soft" data-tab="${tab==='words'?'sentences':'words'}">${tab==='words'?'接下来：生活对话 →':'← 再看看词块'}</button></div></div>${side()}</div>`;
}
function collectBackup(){const records={};for(const [k,total] of Object.entries(progressKeys)){const raw=localStorage.getItem(k);if(raw)records[k]=validateProgress(JSON.parse(raw),total);}records[key]=state;return {app:'daily-cantonese',version:1,exportedAt:new Date().toISOString(),records};}
function exportProgress(){try{const blob=new Blob([JSON.stringify(collectBackup(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`日日粤-学习进度-${dateKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已生成备份，请将 JSON 文件保存在安全的位置。');}catch{toast('备份失败：有记录无法读取。请保留当前文件，勿清除网站数据。');}}
document.addEventListener('change',async e=>{
 if(e.target.id==='challenge-done'){if(reviewId!==null&&!state.completed.includes(lessonId()))return;state.challenges??={};state.challenges[lessonId()]=e.target.checked;save();render();}
 if(e.target.id==='import-progress'){
  pendingImport=null;const file=e.target.files[0],preview=document.querySelector('#import-preview');if(!file)return;
  try{if(file.size>2000000)throw new Error('备份文件过大，请选择本 App 导出的 JSON。');pendingImport=parseBackup(await file.text());preview.replaceChildren();const p=document.createElement('p');p.textContent=`检测到 ${Object.entries(pendingImport).map(([k,v])=>`${Object.values(plans).find(p=>p.key===k).name} ${v.completed.length} 天`).join('、')}。确认导入将替换备份所含课程的当前记录，其余课程保留。建议先导出当前进度。`;preview.append(p);const b=document.createElement('button');b.id='confirm-import';b.className='primary';b.textContent='确认替换并导入';preview.append(b);}catch(error){preview.textContent=error.message;pendingImport=null;}
 }
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.level){changeLevel(b.dataset.level);return;}
 if(b.id==='export-progress'){exportProgress();return;}
 if(b.id==='confirm-import'&&pendingImport){try{const before={};for(const k of Object.keys(pendingImport))before[k]=localStorage.getItem(k);localStorage.setItem('daily-cantonese-before-import',JSON.stringify(before));try{for(const [k,v] of Object.entries(pendingImport))localStorage.setItem(k,JSON.stringify(v));}catch(error){for(const [k,v] of Object.entries(before)){if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}throw error;}state=loadState();pendingImport=null;running=false;speech.stop();render();toast('导入完成。可以切换模式查看对应进度。');}catch{toast('导入失败，可能是存储空间不足。请勿清除原记录。');}return;}
 if(b.id==='recall-toggle'){recall=!recall;listening=false;render();return;}
 if(b.id==='listening-toggle'&&speech.voice){listening=!listening;recall=false;render();return;}
 if(b.dataset.speak!==undefined){const items=b.dataset.sentence==='true'?course[lessonId()].sentences:course[lessonId()].words;speech.play(items[Number(b.dataset.speak)][0],Number(b.dataset.rate));return;}
 if(b.id==='stop-speech'){speech.stop();return;}
 if(b.dataset.view||b.dataset.tab||b.dataset.review!==undefined||b.dataset.open!==undefined||b.id==='back-review')speech.stop();
 if(b.dataset.view){view=b.dataset.view;reviewId=null;recall=false;listening=false;pendingImport=null;render();}
 else if(b.dataset.open!==undefined){const id=Number(b.dataset.open);reviewId=id===currentLesson(state,today,course.length)&&!state.completed.includes(id)?null:id;view='learn';tab='words';recall=false;listening=false;render();window.scrollTo({top:0,behavior:'smooth'});}
 else if(b.dataset.tab){tab=b.dataset.tab;render();}
 else if(b.dataset.mark){const id=lessonId();if(reviewId!==null&&!state.completed.includes(id))return;const m=marks(id),v=b.dataset.mark;state.marks[id]=m.includes(v)?m.filter(x=>x!==v):[...m,v];save();render();}
 else if(b.dataset.review!==undefined){reviewId=Number(b.dataset.review);tab='words';recall=false;listening=false;render();}
 else if(b.id==='back-review'){reviewId=null;view=view==='review'?'review':'catalog';recall=false;listening=false;render();}
 else if(b.id==='hide-meaning'){const hidden=b.textContent==='隐藏释义';document.querySelectorAll('#cards .meaning').forEach(x=>x.style.visibility=hidden?'hidden':'');b.textContent=hidden?'显示释义':'隐藏释义';}
 else if(b.id==='timer-toggle'){running=!running;lastTick=Date.now();render();}
 else if(b.id==='checkin'){const id=lessonId();if(reviewId!==null||!readyToCheckin()||state.completed.length===course.length||state.checkins.some(x=>x.date===today))return;state.checkins.push({date:today,lesson:id});if(!state.completed.includes(id))state.completed.push(id);running=false;save();render();toast(state.completed.length===course.length?'全部课程完成！继续在生活里练习粤语吧。':'今日打卡成功！下一天继续，慢慢嚟。');}
});
setInterval(()=>{
 if(dateKey()!==today){today=dateKey();running=false;render();}
 if(!running)return;const now=Date.now(),elapsed=Math.floor((now-lastTick)/1000);if(elapsed<1)return;lastTick+=elapsed*1000;state.sessions[today]=Math.min(1200,seconds()+elapsed);save();
 if(seconds()>=1200){running=false;toast('20 分钟完成！温习完记得打卡。');render();return;}
 const el=document.querySelector('#timer');if(el)el.textContent=timeText();const bar=document.querySelector('#timer-bar');if(bar)bar.style.width=Math.min(seconds()/12,100)+'%';
},1000);
render();

</script></body></html>
